<!DOCTYPE html>
<html>
<head>
    <title>Tinda Track - Reports</title>
</head>

<body>

    <h1>Tinda Track</h1>
    <h2>User and Role Report</h2>

    <p>This report uses an INNER JOIN between the Users and Roles tables.</p>

    <table border="1">

        <thead>
            <tr>
                <th>User ID</th>
                <th>Username</th>
                <th>Full Name</th>
                <th>Role</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="reportTable">
        </tbody>

    </table>

        <h2>Debts + Payments</h2>

    <p>This report uses LEFT JOIN and RIGHT JOIN combined with UNION (FULL OUTER JOIN equivalent).</p>

    <button onclick="loadDebtReport()">Load Report</button>

    <table border="1">
        <thead>
            <tr>
                <th>Debt ID</th>
                <th>Customer</th>
                <th>Amount</th>
                <th>Paid</th>
                <th>Balance</th>
                <th>Payment</th>
            </tr>
        </thead>
        <tbody id="debtReport"></tbody>
    </table>

    <script src="js/reports.js"></script>

</body>
</html>
