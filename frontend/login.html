
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinda Track - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #2980b9;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Tinda Track</h2>
        <p style="text-align:center;">Store Owner Login</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username"
                   placeholder="Enter username" required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>
    </div>

    <script src="login.js"></script>
    
</body>
</html>
