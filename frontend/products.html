<!DOCTYPE html>
<html>
<head>
    <title>Tinda Track - Products</title>
</head>
<body>
    <h1>Product Management</h1>

    <form id="productForm">
        <input id="product_name" placeholder="Product Name" required>
        <input id="category_id" type="number" placeholder="Category ID" required>
        <input id="unit_id" type="number" placeholder="Unit ID" required>
        <input id="price" type="number" step="0.01" placeholder="Price" required>
        <select id="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>
        <button type="submit">Add Product</button>
    </form>

    <br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th><th>Product</th><th>Category</th>
                <th>Unit</th><th>Price</th><th>Status</th><th>Action</th>
            </tr>
        </thead>
        <tbody id="productTable"></tbody>
    </table>

    <script src="js/products.js"></script>
</body>
</html>
