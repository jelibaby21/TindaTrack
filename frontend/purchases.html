<!DOCTYPE html>
<html>
<head>
    <title>Tinda Track - Purchases</title>
</head>
<body>
    <h1>Purchase Management</h1>

    <form id="purchaseForm">
        <input id="supplier_id" type="number" placeholder="Supplier ID" required>
        <input id="purchase_date" type="date" required>
        <input id="total_amount" type="number" step="0.01" placeholder="Total Amount" required>
        <button type="submit">Add Purchase</button>
    </form>

    <br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th><th>Supplier</th><th>Date</th>
                <th>Total</th><th>Status</th><th>Action</th>
            </tr>
        </thead>
        <tbody id="purchaseTable"></tbody>
    </table>

    <script src="js/purchases.js"></script>
</body>
</html>
