<!DOCTYPE html>
<html>

<head>
    <title>Tinda Track - Activity Logs</title>
</head>

<body>

    <h1>Activity Logs</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Log ID</th>
                <th>User</th>
                <th>Action</th>
                <th>Description</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody id="logTable"></tbody>
    </table>

    <script>
        const loadActivityLogs = () => {
            fetch('http://localhost:3000/api/activity-logs')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load activity logs');
                    }

                    return response.json();
                })
                .then(logs => {
                    const table = document.getElementById('logTable');
                    table.innerHTML = '';

                    logs.forEach(log => {
                        const date = log.timestamp
                            ? new Date(log.timestamp).toLocaleString('en-US', {
                                month: '2-digit',
                                day: '2-digit',
                                year: 'numeric',
                                hour: 'numeric',
                                minute: '2-digit',
                                hour12: true
                            })
                            : '';

                        const description =
                            `Table: ${log.table_name || ''}, Record ID: ${log.record_id || ''}`;

                        table.innerHTML += `
                            <tr>
                                <td>${log.log_id}</td>
                                <td>${log.username || 'Unknown'}</td>
                                <td>${log.action}</td>
                                <td>${description}</td>
                                <td>${date}</td>
                            </tr>
                        `;
                    });
                })
                .catch(error => {
                    console.error('Error loading activity logs:', error);
                });
        };

        loadActivityLogs();
    </script>

</body>

</html>
